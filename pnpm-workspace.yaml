# Security-floor overrides for transitive dependencies.
#
# These live here, not in package.json's `pnpm.overrides` block, because
# pnpm 11 no longer reads that field at all — it warns "the pnpm field in
# package.json is no longer read by pnpm" and then resolves as though the
# overrides did not exist. This repo has no CI, and render.yaml installs
# with whatever pnpm Render provides, so a silent drop here would go
# unnoticed. packageManager now pins the version as a second guard.
overrides:
  "@babel/plugin-transform-modules-systemjs": "^7.29.4"
  "browserslist": "^4.28.7"
  "fast-uri": "^3.1.6"
  "flatted": "^3.4.2"
  "form-data": "^4.0.6"
  "js-yaml": "^4.3.1"
  "lodash": "^4.18.0"
  "lodash-es": "^4.18.0"
  "nanoid": "^3.3.12"
  "postcss": "^8.5.18"
  "ws": "^8.21.0"
